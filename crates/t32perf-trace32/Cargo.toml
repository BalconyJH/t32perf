[package]
name = "t32perf-trace32"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4.0"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
schemars = "1.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
t32perf-model = { version = "0.1.0", path = "../t32perf-model" }
thiserror = "2.0.20"

[dev-dependencies]
jsonschema = { version = "0.50.1", default-features = false }
object = { version = "0.40.0", default-features = false, features = ["read_core", "write_core", "elf", "std"] }
