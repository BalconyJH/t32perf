name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # latest
      - name: Run repository checks
        run: cargo xtask check
      - name: Generate one-million-observation benchmark input
        run: >-
          cargo run --release -p t32perf --
          --artifact-root target/benchmark-release --json
          capture --provider synthetic --id benchmark --events 1000000
      - name: Run SHA-256-conditioned parser candidates
        run: >-
          cargo xtask bench
          --input target/benchmark-release/benchmark/normalized/observations.ndjson
          > target/parser-candidates-${{ matrix.os }}.json
      - name: Enforce parser regression budgets
        run: >-
          uv run --no-project tools/bench/check_regression.py
          target/parser-candidates-${{ matrix.os }}.json
          > target/parser-regression-${{ matrix.os }}.json
      - name: Upload performance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: performance-${{ matrix.os }}
          path: |
            target/parser-candidates-${{ matrix.os }}.json
            target/parser-regression-${{ matrix.os }}.json
          if-no-files-found: warn
      - name: Build release package
        run: cargo xtask package --output dist
        env:
          T32PERF_COMMIT: ${{ github.sha }}
      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.SHA256SUMS
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
