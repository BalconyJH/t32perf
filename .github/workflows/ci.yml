name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: taiki-e/install-action@7c6f5444541685720fe90ed47f7fa10f12f790f5 # nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --doc
      - run: cargo xtask schemas --check

  c-sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # latest
      - run: cmake -S sdk/c -B target/c-sdk -DT32PERF_BUILD_TESTS=ON
      - run: cmake --build target/c-sdk --config Release
      - run: ctest --test-dir target/c-sdk -C Release --output-on-failure

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --project hil --locked
      - run: uv run --project hil ruff check --config hil/pyproject.toml hil tools/bench
      - run: >-
          uv run --project hil ruff format --check
          --config hil/pyproject.toml hil tools/bench
      - run: uv run --project hil pytest hil/tests -m "not hardware"
      - run: uv run --no-project -m unittest discover -s tools/bench -p "test_*.py"
      - run: uv run --no-project -m unittest tools.test_validate_skill
      - run: uv run --no-project tools/validate_skill.py skill-trace32-perf
      - run: uv run --no-project tools/validate_skill.py skills/t32perf-mcp

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - run: uvx --from zensical==0.0.57 zensical build --clean --strict

  perfetto-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.95.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - run: >-
          cargo run -p t32perf --
          --artifact-root target/perfetto-smoke --json
          capture --provider synthetic --id perfetto-smoke --events 64
      - run: >-
          cargo run -p t32perf --
          --artifact-root target/perfetto-smoke --json
          analyze perfetto-smoke
      - run: >-
          cargo run -p t32perf --
          --artifact-root target/perfetto-smoke --json
          convert perfetto-smoke --format perfetto-json
      - run: >-
          uv run --no-project --with perfetto==0.57.2
          tools/validate_perfetto.py
          target/perfetto-smoke/perfetto-smoke/report/trace.json

  # Package only after every bundled surface passes its focused validation.
  package:
    needs:
      - rust
      - c-sdk
      - python
      - docs
      - perfetto-import
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.95.0
      - run: cargo xtask package --output target/package-ci
