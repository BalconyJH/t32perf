name: Benchmark

on:
  workflow_dispatch:
    inputs:
      events:
        description: Canonical synthetic observation count
        required: true
        type: choice
        default: "1000000"
        options:
          - "1000000"
          - "10000000"
      analyzer_extended:
        description: Include the 10M analyzer Criterion case
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  candidates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.95.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: >-
          cargo run --release -p t32perf --
          --artifact-root target/benchmark-data --json
          capture --provider synthetic --id benchmark --events ${{ inputs.events }}
      - name: Run SHA-256-conditioned parser candidates
        run: >-
          cargo xtask bench
          --input target/benchmark-data/benchmark/normalized/observations.ndjson
          > target/parser-candidates-${{ runner.os }}.json
      - name: Enforce parser regression budgets
        run: >-
          uv run --no-project tools/bench/check_regression.py
          target/parser-candidates-${{ runner.os }}.json
          > target/parser-regression-${{ runner.os }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: parser-candidates-${{ runner.os }}-${{ inputs.events }}
          path: |
            target/parser-candidates-${{ runner.os }}.json
            target/parser-regression-${{ runner.os }}.json
          if-no-files-found: error

  analyzer:
    if: ${{ inputs.analyzer_extended }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.95.0
      - run: cargo xtask bench --extended
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: analyzer-criterion-${{ runner.os }}
          path: target/criterion
          if-no-files-found: error
