[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1.9"
serde_json = "1.0.151"
sha2 = "0.11.0"
t32perf-model = { version = "0.1.0", path = "../crates/t32perf-model" }
t32perf-trace32 = { version = "0.1.0", path = "../crates/t32perf-trace32" }
tar = "0.4.46"
tempfile = "3.27.0"
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
